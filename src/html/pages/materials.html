  <!-- ══════ 3. 자재 발주 관리 ══════ -->
  <div class="content list-page" id="pg-materials">

    <!-- 고정 헤더: KPI + 필터/버튼 툴바 -->
    <div class="mat-sticky-header">
      <div class="metrics" id="mat-kpi">
    <div class="mc"><div class="mc-lbl"><i class="ti ti-circle-dashed"></i>발주 전 대기</div><div class="mc-val">8건</div></div>
    <div class="mc"><div class="mc-lbl"><i class="ti ti-truck-delivery" style="color:var(--tx-i);"></i>외주 배송중</div><div class="mc-val" style="color:var(--tx-i);">37건</div></div>
    <div class="mc"><div class="mc-lbl"><i class="ti ti-circle-check" style="color:var(--tx-ok);"></i>창고 입고 완료</div><div class="mc-val" style="color:var(--tx-ok);">28건</div></div>
    <div class="mc"><div class="mc-lbl"><i class="ti ti-coin"></i>예산 소요 규모</div><div class="mc-val">₩501만</div><div class="mc-sub">실납품 완료액 ₩60만</div></div></div>
      <div class="toolbar" style="margin-bottom:0;">
        <select id="mat-fc" onchange="onMatClientChange()" style="min-width:140px;"><option value="">전체 의뢰 고객사</option></select>
        <select id="mat-fp" onchange="renderMaterials()" style="min-width:170px;"><option value="">전체 제품 목록</option></select>
        <select id="mat-fs" onchange="renderMaterials()"><option value="">전체 입고 상태</option><option>발주전</option><option>발주중</option><option>입고완료</option><option>지연</option></select>
        <input type="text" id="mat-q" placeholder="자재명 또는 발주처 검색..." style="min-width:180px;" oninput="renderMaterials()">
        <button class="btn btn-primary pc-only" onclick="openMatAdd()"><i class="ti ti-plus"></i>신규 자재 발주 요청</button>
        <label class="btn pc-only" style="cursor:pointer; margin:0;" title="발주서 XLS 파일을 업로드하여 자재 수급에 자동 추가">
          <i class="ti ti-file-import"></i>발주서 XLS 가져오기
          <input type="file" id="xls-po-input" accept=".xls,.xlsx" style="display:none;" onchange="importPoXLS(this)">
        </label>
        <button class="btn pc-only" onclick="exportMatCSV()"><i class="ti ti-download"></i>전체 엑셀 CSV 내보내기</button>
      </div>
    </div>
    
    <!-- 자재 발주 입력 패널 -->
    <div class="card"><div id="mat-table" style="overflow-x:auto;">
    <table style="min-width: 1080px;">
      <thead>
        <tr>
          <th>자재코드</th><th>구분고객사</th><th>매칭제품</th><th>자재품명</th><th>협력공급처</th>
          <th>구매단가</th><th>수량</th><th>매입총액</th><th>주문일자</th><th>입고예정일</th><th>진행상황</th><th>참고사항</th><th>관리작업</th>
        </tr>
      </thead>
      <tbody></tbody>
      <tfoot>
        <tr style="background:var(--bg-s);">
          <td colspan="7" style="font-size:11px; font-weight:700;">조건부 합계 건수 : 73건</td>
          <td style="font-weight:700; color:var(--tx-i);">₩5,006,740</td>
          <td colspan="5"></td>
        </tr>
      </tfoot>
    </table></div></div>
  </div>
