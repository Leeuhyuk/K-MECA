<div class="content" id="pg-calendar">
  <div class="page-content">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap;">
      <span style="font-size:16px;font-weight:700;display:flex;align-items:center;gap:6px;">
        <i class="ti ti-calendar-event" style="color:var(--tx-i);"></i>납기 캘린더
      </span>
      <div style="display:flex;gap:5px;align-items:center;padding:4px 8px;background:var(--bg-s);border:1px solid var(--br);border-radius:var(--rm);">
        <select id="cal-view" onchange="calChangeView(this.value)" style="height:28px;min-width:96px;font-size:11px;">
          <option value="year">연</option>
          <option value="month" selected>월</option>
          <option value="day">일</option>
        </select>
        <button class="btn btn-sm" style="height:28px;padding:0 9px;" onclick="calNav(-1)"><i class="ti ti-chevron-left"></i></button>
        <span id="cal-title" style="font-weight:700;min-width:115px;text-align:center;font-size:13px;"></span>
        <button class="btn btn-sm" style="height:28px;padding:0 9px;" onclick="calNav(1)"><i class="ti ti-chevron-right"></i></button>
        <button class="btn btn-sm" style="height:28px;padding:0 10px;" onclick="calGoToday()">오늘</button>
        <button class="btn btn-sm" style="height:28px;padding:0 9px;" onclick="calResetView()" title="이번 달로 초기화"><i class="ti ti-x"></i></button>
      </div>
      <div style="display:flex;gap:10px;font-size:11px;align-items:center;flex-wrap:wrap;">
        <span style="display:inline-flex;align-items:center;gap:4px;"><span style="width:10px;height:10px;border-radius:2px;background:#e03131;display:inline-block;"></span>D-3 이내</span>
        <span style="display:inline-flex;align-items:center;gap:4px;"><span style="width:10px;height:10px;border-radius:2px;background:#f08c00;display:inline-block;"></span>D-7 이내</span>
        <span style="display:inline-flex;align-items:center;gap:4px;"><span style="width:10px;height:10px;border-radius:2px;background:#1971c2;display:inline-block;"></span>납기 예정</span>
        <span style="display:inline-flex;align-items:center;gap:4px;"><span style="width:10px;height:10px;border-radius:2px;background:#40c057;display:inline-block;"></span>자재 입고예정</span>
      </div>
    </div>
    <div id="cal-grid" style="overflow-x:auto;"></div>
    <div id="cal-detail" style="margin-top:16px;display:none;"></div>
  </div>
</div>
