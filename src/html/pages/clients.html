  <!-- ══════ 2. 수주 관리 ══════ -->
  <div class="content" id="pg-clients">
    <!-- KPI 요약 (renderClients 가 공통 kpiCardHtml 로 채운다) -->
    <div class="sum-row" id="client-summary"></div>
    <div class="sec-lbl"><i class="ti ti-building-community"></i>수주 의뢰 업체 및 상세 품목 현황</div>
    <div class="toolbar">
      <button class="btn" id="btn-show-closed" onclick="toggleClosedView()" style="border-color: var(--br);"><i class="ti ti-archive"></i>종료 프로젝트 (0)</button>
      <input type="text" id="clients-q" placeholder="업체명 또는 담당자 검색..." style="min-width:200px;" oninput="renderClients()">
      <button class="btn btn-primary btn-icon" onclick="openClientAdd()" title="고객사 등록"><i class="ti ti-plus"></i></button>
    </div>
    <!-- 고객사 추가 패널 -->
    <div id="client-list">
      <div class="empty"><i class="ti ti-loader animate-spin"></i>데이터를 불러오는 중...</div>
    </div>
    <!-- 고객사 360도 뷰 패널 -->
    <div id="client-360-wrapper" style="display:none;margin-top:16px;">
      <div class="card">
        <div class="card-hd">
          <span class="card-ttl" id="client-360-title"><i class="ti ti-building-community"></i>고객사 종합 현황</span>
          <button class="btn btn-sm" onclick="document.getElementById('client-360-wrapper').style.display='none'"><i class="ti ti-x"></i>닫기</button>
        </div>
        <div id="client-360-panel" style="padding:0 4px 8px;"></div>
      </div>
    </div>
  </div>
