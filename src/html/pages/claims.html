  <!-- ══════ 고객 클레임 관리 (전용 페이지) ══════ -->
  <div class="content list-page" id="pg-claims">
    <div class="metrics" id="claims-kpi"></div>
    <div class="card">
      <div class="card-hd">
        <span class="card-ttl"><i class="ti ti-message-report" style="color:var(--tx-d);"></i>납품 후 고객사 클레임 내역</span>
        <div style="display:flex; gap:6px; flex-wrap:wrap;">
          <input type="text" id="claims-q" placeholder="업체·제품·내용 검색..." style="min-width:180px; height:28px; font-size:11px; padding:0 8px; border:1px solid var(--br); border-radius:var(--rm); background:var(--bg-p); color:var(--tx);" oninput="renderClaims()">
          <select id="claims-fs" style="height:28px; font-size:11px; padding:0 6px; border:1px solid var(--br); border-radius:var(--rm); background:var(--bg-p); color:var(--tx);" onchange="renderClaims()">
            <option value="">전체 상태</option>
            <option>접수</option>
            <option>처리중</option>
            <option>완료</option>
          </select>
          <button class="btn btn-sm" onclick="exportClaimsCSV()"><i class="ti ti-download"></i>전체 엑셀 CSV 내보내기</button>
          <button class="btn btn-sm btn-primary" onclick="openClaimAdd()"><i class="ti ti-plus"></i>클레임 등록</button>
        </div>
      </div>
      <div id="claims-table-full" style="overflow-x:auto;"></div>
    </div>
  </div>
