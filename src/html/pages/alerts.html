  <!-- ══════ 8. 알림 로그 관리 ══════ -->
  <div class="content" id="pg-alerts">
    <div class="toolbar" id="alerts-toolbar">
      <button class="btn btn-primary" onclick="filterAlerts('all')">전체 알림</button>
      <button class="btn" onclick="filterAlerts('err')">긴급 위험 (Err)</button>
      <button class="btn" onclick="filterAlerts('warn')">경고 확인 (Warn)</button>
      <button class="btn btn-primary btn-icon" onclick="openAlertAdd()" style="margin-left:auto;" title="알림 직접 등록"><i class="ti ti-plus"></i></button>
    </div>

    <!-- 자동 감지 알림 유형별 체크 필터 패널 -->
    <div class="card" style="margin-bottom:16px; padding:16px; border:1px solid var(--br); border-radius:var(--rl); background:var(--bg-s);">
      <div style="font-size:13px; font-weight:700; color:var(--tx-s); margin-bottom:12px; display:flex; align-items:center; gap:6px;">
        <i class="ti ti-settings" style="font-size:16px; color:var(--tx-i);"></i> 자동 감지 알림 활성화 설정
      </div>
      <div style="display:flex; flex-wrap:wrap; gap:16px; font-size:12px; color:var(--tx-s);">
        <label style="display:flex; align-items:center; gap:6px; cursor:pointer;">
          <input type="checkbox" id="chk-mat_pending" onchange="toggleAlertSetting('mat_pending')"> 자재발주 미처리
        </label>
        <label style="display:flex; align-items:center; gap:6px; cursor:pointer;">
          <input type="checkbox" id="chk-mat_delay" onchange="toggleAlertSetting('mat_delay')"> 입고 임박 자재
        </label>
        <label style="display:flex; align-items:center; gap:6px; cursor:pointer;">
          <input type="checkbox" id="chk-prod_delivery" onchange="toggleAlertSetting('prod_delivery')"> 납기 위험 제품
        </label>
        <label style="display:flex; align-items:center; gap:6px; cursor:pointer;">
          <input type="checkbox" id="chk-inv_low" onchange="toggleAlertSetting('inv_low')"> 안전재고 미달
        </label>
        <label style="display:flex; align-items:center; gap:6px; cursor:pointer;">
          <input type="checkbox" id="chk-defect_open" onchange="toggleAlertSetting('defect_open')"> 미처리 불량
        </label>
        <label style="display:flex; align-items:center; gap:6px; cursor:pointer;">
          <input type="checkbox" id="chk-wo_delayed" onchange="toggleAlertSetting('wo_delayed')"> 생산지시 지연
        </label>
      </div>
    </div>
    <div id="alerts-list"></div>
  </div>
