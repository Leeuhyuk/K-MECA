<!-- ══ 거래처 등록/수정 모달 ══ -->
<div class="overlay" id="partner-modal" style="z-index:10000;">
  <div class="dlg" style="max-width:580px; width:95%;">
    <div class="dlg-title" id="partner-modal-ttl"><i class="ti ti-address-book" style="color:var(--tx-i);"></i>거래처 등록</div>
    <div class="fg fg2" style="gap:10px; margin-bottom:14px;">
      <div class="ff"><label>거래처명 *</label><input id="bp-name" placeholder="예: 예주산업"></div>
      <div class="ff"><label>유형 *</label>
        <select id="bp-type"><option>공급처</option><option>구매처</option><option>외주처</option><option>기타</option></select>
      </div>
      <div class="ff"><label>담당자</label><input id="bp-mgr" placeholder="홍길동"></div>
      <div class="ff"><label>전화번호</label><input id="bp-tel" placeholder="031-000-0000"></div>
      <div class="ff"><label>휴대폰</label><input id="bp-mobile" placeholder="010-0000-0000"></div>
      <div class="ff"><label>이메일 *</label><input id="bp-email" type="email" placeholder="contact@company.com"></div>
      <div class="ff"><label>팩스</label><input id="bp-fax" placeholder="031-000-0001"></div>
      <div class="ff"><label>사업자번호</label><input id="bp-bizno" placeholder="123-45-67890"></div>
      <div class="ff" style="grid-column:span 2;"><label>주소</label><input id="bp-addr" placeholder="경기도 화성시 ..."></div>
      <div class="ff" style="grid-column:span 2;"><label>비고</label><input id="bp-note" placeholder="특이사항"></div>
    </div>
    <div class="dlg-actions">
      <button class="btn" onclick="closeModal('partner-modal')">취소</button>
      <button class="btn btn-primary" id="bp-save-btn" onclick="savePartnerForm()"><i class="ti ti-check"></i>저장</button>
    </div>
  </div>
</div>

<!-- ══ 거래처 선택 피커 모달 ══ -->
<div class="overlay" id="client-picker-modal" style="z-index:10000;">
  <div class="dlg" style="max-width:520px; width:95%;">
    <div class="dlg-title"><i class="ti ti-search" style="color:var(--tx-i);"></i>고객사 선택</div>
    <div style="display:flex;gap:8px;margin-bottom:12px;">
      <input id="cp-q" placeholder="고객사명·담당자·이메일 검색..." style="flex:1;" oninput="renderClientPickerList()">
    </div>
    <div id="cp-list" style="max-height:320px;overflow-y:auto;border:1px solid var(--br);border-radius:var(--rm);"></div>
    <div style="margin-top:12px;display:flex;justify-content:space-between;align-items:center;">
      <button class="btn btn-sm" onclick="closeModal('client-picker-modal'); openClientAdd();"><i class="ti ti-plus"></i>신규 고객사 등록</button>
      <button class="btn" onclick="closeModal('client-picker-modal')">닫기</button>
    </div>
  </div>
</div>

<div class="overlay" id="partner-picker-modal" style="z-index:10000;">
  <div class="dlg" style="max-width:520px; width:95%;">
    <div class="dlg-title"><i class="ti ti-search" style="color:var(--tx-i);"></i>거래처 선택</div>
    <div style="display:flex;gap:8px;margin-bottom:12px;">
      <input id="pp-q" placeholder="거래처명·담당자·이메일 검색..." style="flex:1;" oninput="renderPickerList()">
      <select id="pp-ft" onchange="renderPickerList()" style="min-width:90px;">
        <option value="">전체</option><option>공급처</option><option>구매처</option><option>외주처</option><option>기타</option>
      </select>
    </div>
    <div id="pp-list" style="max-height:320px;overflow-y:auto;border:1px solid var(--br);border-radius:var(--rm);"></div>
    <div style="margin-top:12px;display:flex;justify-content:space-between;align-items:center;">
      <button class="btn btn-sm" onclick="openPartnerModalFromPicker()"><i class="ti ti-plus"></i>신규 거래처 등록</button>
      <button class="btn" onclick="closeModal('partner-picker-modal')">닫기</button>
    </div>
  </div>
</div>

<!-- ══ 견적요청서 등록/수정 팝업 모달 ══ -->
<div class="overlay" id="rfq-modal">
  <div class="dlg" style="max-width:680px; width:96%;">
    <div class="dlg-title" id="rfq-modal-ttl"><i class="ti ti-file-description" style="color:var(--tx-i);"></i>견적요청서 등록</div>
    <div class="fg fg4" style="gap:10px; margin-bottom:14px;">
      <div class="ff"><label>문서번호</label><input id="rq-id" readonly></div>
      <div class="ff"><label>요청일자 *</label><input id="rq-date" type="date"></div>
      <div class="ff"><label>상태</label>
        <select id="rq-status"><option>요청전</option><option>요청중</option><option>회신완료</option><option>채택</option><option>미채택</option></select>
      </div>
      <div class="ff"><label>연결 고객사</label><select id="rq-client" onchange="onRfqClientChange()"><option value="">-- 선택 --</option></select></div>
      <div class="ff"><label>연결 제품</label><select id="rq-product"><option value="">-- 선택 --</option></select></div>
      <div class="ff" style="grid-column:span 2;"><label>공급처/협력사 *</label>
        <div style="display:flex;gap:4px;">
          <input id="rq-supplier" placeholder="공급처명" style="flex:1;">
          <button type="button" class="btn btn-sm" onclick="openPartnerPicker(function(p){inp('rq-supplier').value=p.name;inp('rq-semail').value=p.email||'';})" style="white-space:nowrap;"><i class="ti ti-search"></i>찾기</button>
        </div>
      </div>
      <div class="ff" style="grid-column:span 2;"><label>공급처 이메일</label><input id="rq-semail" type="email" placeholder="supplier@example.com"></div>
      <div class="ff" style="grid-column:span 2;"><label>품목명 *</label><input id="rq-item" placeholder="예: 서보모터 200W"></div>
      <div class="ff" style="grid-column:span 2;"><label>규격/사양</label><input id="rq-spec" placeholder="예: 220V, ISO규격 등"></div>
      <div class="ff"><label>수량</label><input id="rq-qty" type="number" placeholder="1" min="0" value="1"></div>
      <div class="ff"><label>단위</label>
        <select id="rq-unit"><option>EA</option><option>대</option><option>SET</option><option>kg</option><option>M</option><option>L</option><option>BOX</option></select>
      </div>
      <div class="ff"><label>희망 단가 (원)</label><input id="rq-target" type="number" placeholder="0" min="0"></div>
      <div class="ff"><label>비고</label><input id="rq-note" placeholder="특이사항, 도면 첨부 여부 등"></div>
    </div>
    <div class="dlg-actions">
      <button class="btn" onclick="closeModal('rfq-modal')">취소</button>
      <button class="btn btn-primary" id="rfq-save-btn" onclick="saveRfqForm()"><i class="ti ti-check"></i>등록</button>
    </div>
  </div>
</div>

<!-- ══ 구매발주서 등록/수정 팝업 모달 ══ -->
<div class="overlay" id="po-modal">
  <div class="dlg" style="max-width:700px; width:96%;">
    <div class="dlg-title" id="po-modal-ttl"><i class="ti ti-file-invoice" style="color:var(--tx-i);"></i>구매발주서 등록</div>
    <div class="fg fg4" style="gap:10px; margin-bottom:14px;">
      <div class="ff"><label>발주번호</label><input id="po-id" readonly></div>
      <div class="ff"><label>발행일자 *</label><input id="po-date" type="date"></div>
      <div class="ff"><label>발주 상태</label>
        <select id="po-status"><option>작성중</option><option>발송완료</option><option>확인완료</option><option>입고완료</option></select>
      </div>
      <div class="ff"><label>연결 고객사</label><select id="po-client-sel" onchange="onPoClientChange()"><option value="">-- 선택 --</option></select></div>
      <div class="ff"><label>연결 제품</label><select id="po-product-sel"><option value="">-- 선택 --</option></select></div>
      <div class="ff" style="grid-column:span 2;"><label>공급처/협력사 *</label>
        <div style="display:flex;gap:4px;">
          <input id="po-supplier" placeholder="발주할 공급처명" style="flex:1;">
          <button type="button" class="btn btn-sm" onclick="openPartnerPicker(function(p){inp('po-supplier').value=p.name;inp('po-semail').value=p.email||'';})" style="white-space:nowrap;"><i class="ti ti-search"></i>찾기</button>
        </div>
      </div>
      <div class="ff" style="grid-column:span 2;"><label>공급처 이메일</label><input id="po-semail" type="email" placeholder="supplier@example.com"></div>
      <div class="ff" style="grid-column:span 2;"><label>품목명 *</label><input id="po-item" placeholder="예: 볼스크류 SFU1605"></div>
      <div class="ff" style="grid-column:span 2;"><label>규격/사양</label><input id="po-spec" placeholder="예: 치수, 재질 등"></div>
      <div class="ff"><label>수량</label><input id="po-qty" type="number" placeholder="1" min="0" value="1"></div>
      <div class="ff"><label>단위</label>
        <select id="po-unit"><option>EA</option><option>대</option><option>SET</option><option>kg</option><option>M</option><option>L</option><option>BOX</option></select>
      </div>
      <div class="ff"><label>단가 (원)</label><input id="po-price" type="number" placeholder="0" min="0"></div>
      <div class="ff"><label>결제 조건</label>
        <select id="po-pay"><option>현금</option><option>T/T</option><option>어음</option><option>카드</option><option>외상</option></select>
      </div>
      <div class="ff"><label>납품 방법</label>
        <select id="po-dlv"><option>직납</option><option>택배</option><option>지입</option><option>화물</option><option>방문수령</option></select>
      </div>
      <div class="ff"><label>비고</label><input id="po-note" placeholder="특이사항 등"></div>
    </div>
    <div class="dlg-actions">
      <button class="btn" onclick="closeModal('po-modal')">취소</button>
      <button class="btn btn-primary" id="po-save-btn" onclick="savePoForm()"><i class="ti ti-check"></i>등록</button>
    </div>
  </div>
</div>

        <textarea id="ala-sub" rows="3" placeholder="예: 먼지 발생 구역 안전 수칙을 준수바랍니다." style="width:100%; border:1px solid var(--br); border-radius:var(--rm); background:var(--bg-p); color:var(--tx); padding:8px; font-size:12px; font-family:inherit; resize:vertical;"></textarea>
      </div>
    </div>
    <div class="dlg-actions">
      <button class="btn" onclick="closeModal('alert-modal')">취소</button>
      <button class="btn btn-primary" onclick="addCustomAlert()"><i class="ti ti-check"></i>등록</button>
    </div>
  </div>
</div>

<!-- ══ 공정 단계 설정 모달 ══ -->
<div class="overlay" id="stage-modal">
  <div class="dlg" style="max-width:440px;width:96%;">
    <div class="dlg-title"><i class="ti ti-list-numbers" style="color:var(--tx-i);"></i>공정 단계 설정</div>
    <div class="fg" style="gap:10px;margin-bottom:14px;">
      <div class="ff"><label>단계 목록 (쉼표 구분)</label><input id="stage-input" style="width:100%;"></div>
    </div>
    <div class="dlg-actions">
      <button class="btn" onclick="closeModal('stage-modal')">취소</button>
      <button class="btn btn-primary" onclick="saveStages(); closeModal('stage-modal');"><i class="ti ti-check"></i>저장</button>
    </div>
  </div>
</div>
